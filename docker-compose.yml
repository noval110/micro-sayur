services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_sayur_container

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

      - ./produk-service/database/migrations/000001_create_products_table.up.sql:/migrations/products.sql:ro

      - ./order-service/database/migrations/000001_create_orders_table.up.sql:/migrations/orders.sql:ro

      - ./order-service/database/migrations/000002_create_order_items_table.up.sql:/migrations/order-items.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # PRODUCT SERVICE

  product-service:
    build:
      context: ./produk-service

    container_name: product_service

    ports:
      - "8081:8081"

    volumes:
      - ./produk-service/uploads:/app/uploads

    environment:

      APP_PORT: 8081
      APP_ENV: development

      DATABASE_HOST: ${PRODUCT_DATABASE_HOST}
      DATABASE_PORT: ${PRODUCT_DATABASE_PORT}
      DATABASE_USER: ${PRODUCT_DATABASE_USER}
      DATABASE_PASSWORD: ${PRODUCT_DATABASE_PASSWORD}
      DATABASE_NAME: ${PRODUCT_DATABASE_NAME}
      DATABASE_MAX_OPEN_CONNECTIONS: 10
      DATABASE_MAX_IDLE_CONNECTIONS: 5
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}
      USER_SERVICE_URL: http://user-service:8084
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}


  # ORDER SERVICE

  order-service:
    build:
      context: ./order-service

    container_name: order_service

    ports:
      - "8082:8082"

    environment:
      APP_PORT: "8082"

      DB_HOST: ${ORDER_DB_HOST}
      DB_PORT: ${ORDER_DB_PORT}
      DB_USER: ${ORDER_DB_USER}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      DB_NAME: ${ORDER_DB_NAME}

      PRODUCT_SERVICE_URL: http://product-service:8081
      USER_SERVICE_URL: http://user-service:8084

      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}

    depends_on:
      product-service:
        condition: service_started


  # PAYMENT SERVICE

  payment-service:
    build:
      context: ./payment-service

    container_name: payment_service

    ports:
      - "8083:8083"

    environment:
      APP_PORT: "8083"

      DB_HOST: ${PAYMENT_DB_HOST}
      DB_PORT: ${PAYMENT_DB_PORT}
      DB_USER: ${PAYMENT_DB_USER}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      DB_NAME: ${PAYMENT_DB_NAME}

      ORDER_SERVICE_URL: http://order-service:8082
      USER_SERVICE_URL: http://user-service:8084

      RABBITMQ_URL: ${RABBITMQ_URL}

      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}

    depends_on:
      order-service:
        condition: service_started

      user-service:
        condition: service_started


  # REDIS

  redis:
    image: redis:7-alpine

    container_name: redis_sayur_container

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


  # RABBITMQ

  rabbitmq:
    image: rabbitmq:3-alpine

    container_name: rabbitmq_sayur_container

    environment:
      RABBITMQ_DEFAULT_USER: sayur
      RABBITMQ_DEFAULT_PASS: sayurpassword

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


  # USER SERVICE

  user-service:
    build:
      context: ./user-service

    container_name: user_service_container

    ports:
      - "8084:8084"

    volumes:
      - ./user-service/uploads:/app/uploads

    environment:
      APP_PORT: "8084"

      DATABASE_HOST: ${USER_DATABASE_HOST}
      DATABASE_PORT: ${USER_DATABASE_PORT}
      DATABASE_USER: ${USER_DATABASE_USER}
      DATABASE_PASSWORD: ${USER_DATABASE_PASSWORD}
      DATABASE_NAME: ${USER_DATABASE_NAME}

      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ISSUER: micro-sayur

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS: ${REDIS_TLS}

      RABBITMQ_URL: ${RABBITMQ_URL}

  # API GATEWAY

  api-gateway:
    image: nginx:alpine

    container_name: api_gateway_container

    ports:
      - "8000:8000"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      product-service:
        condition: service_started

      order-service:
        condition: service_started

      payment-service:
        condition: service_started

      user-service:
        condition: service_started


volumes:
  pgdata:
